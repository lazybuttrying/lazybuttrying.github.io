<!doctype html>
  <html lang="ko">
    <head>
      <meta charset="utf-8" />
      <title>Macroeconomics</title>
      <script>
        (function () {
          var BASE = '/macroeconomics/';
          var CHAPTERS = ["macro-intro","ad-as","demand-spending","money-prices","interest-markets","wages-unemployment","open-economy","growth","uncertainty-macro"];
          var stored = null;
          try { stored = localStorage.getItem('lang'); } catch (e) {}
          var lang = stored === 'en' || stored === 'ko' ? stored : 'ko';
          var rel = location.pathname.indexOf(BASE) === 0
            ? location.pathname.slice(BASE.length)
            : location.pathname.replace(/^\//, '');
          var segments = rel.split('/').filter(Boolean);
          var first = segments[0] || '';
          var target;
          if (first === 'ko' || first === 'en') {
            target = BASE + first + '/';
          } else if (CHAPTERS.indexOf(first) !== -1) {
            target = BASE + lang + '/' + segments.join('/') + '/' + location.search;
          } else {
            target = BASE + lang + '/';
          }
          location.replace(target);
        })();
      </script>
    </head>
    <body>
      <p>Page not found. <a href="/macroeconomics/ko/">한국어 홈</a> · <a href="/macroeconomics/en/">English home</a></p>
    </body>
  </html>
