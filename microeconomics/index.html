<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Microeconomics</title>
    <meta http-equiv="refresh" content="0; url=/microeconomics/ko/" />
    <script>
      try {
        var stored = localStorage.getItem('lang');
        var lang = stored === 'en' || stored === 'ko' ? stored : 'ko';
        location.replace('/microeconomics/' + lang + '/' + location.search);
      } catch (e) {
        location.replace('/microeconomics/ko/');
      }
    </script>
  </head>
  <body>
    <p><a href="/microeconomics/ko/">한국어</a> · <a href="/microeconomics/en/">English</a></p>
  </body>
</html>
