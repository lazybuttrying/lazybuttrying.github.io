<script>
const MONTHS = Object.keys(window.MONTHLY_DATA.months).sort();
const btnWrap = document.getElementById('monthBtns');
MONTHS.forEach(m => {
  const b = document.createElement('button');
  b.textContent = m.slice(0, 4) + '년 ' + parseInt(m.slice(5), 10) + '월';
  b.dataset.month = m;
  b.addEventListener('click', () => render(m));
  btnWrap.appendChild(b);
});
function render(m) {
  document.querySelectorAll('#monthBtns button').forEach(b =>
    b.classList.toggle('on', b.dataset.month === m));
  const d = window.MONTHLY_DATA.months[m];
  document.getElementById('monthTitle').textContent =
    m.slice(0, 4) + '년 ' + parseInt(m.slice(5), 10) + '월';
  document.getElementById('newsList').innerHTML =
    d.news.map(n => `<li>${n}</li>`).join('');
  document.getElementById('statsLine').textContent =
    `월중앙값 ${d.month_median}bp · 월초 ${d.first}bp → 월말 ${d.last}bp`;
  document.getElementById('srcList').innerHTML =
    (d.sources || []).map(s =>
      `<li><a href="${s.url}" target="_blank" rel="noopener">${s.topic}</a> <span class="meta">${s.outlet} ${s.date}</span></li>`).join('');
  const el = document.getElementById('chart');
  try {
    if (typeof Plotly === 'undefined') throw new Error('chart library unavailable');
    Plotly.newPlot('chart', [{
      x: d.dates, y: d.median, mode: 'lines+markers',
      name: '시장 중앙값', line: { width: 2.5, color: '#2563eb' }
    }], {
      margin: { t: 10, r: 10, b: 40, l: 50 },
      yaxis: { title: 'bp' }, height: 340
    }, { displayModeBar: false, responsive: true });
  } catch (e) {
    el.innerHTML = '<div style="color:#666;font-size:14px;padding:16px 0;">차트를 불러오지 못했습니다 (차트 라이브러리 연결 실패).</div>';
  }
}
render(MONTHS[MONTHS.length - 1]);
</script>
