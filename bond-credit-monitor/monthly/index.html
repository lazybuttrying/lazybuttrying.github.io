<script>
const EVENTS = window.EVENTS_DATA.events;
const btnWrap = document.getElementById('eventBtns');
EVENTS.forEach(ev => {
  const b = document.createElement('button');
  b.textContent = ev.title;
  b.dataset.id = ev.id;
  b.addEventListener('click', () => render(ev.id));
  btnWrap.appendChild(b);
});
const BAND_STYLE = {
  market: { width: 3, color: '#2563eb' },
  AAA: { width: 1.5, color: '#16a34a' },
  AA: { width: 1.5, color: '#ca8a04' },
  A: { width: 1.5, color: '#9333ea' },
  BBB: { width: 1.5, color: '#dc2626' },
};
const BAND_NAME = { market: '시장 중앙값', AAA: 'AAA', AA: 'AA', A: 'A', BBB: 'BBB+이하' };
function render(id) {
  document.querySelectorAll('#eventBtns button').forEach(b =>
    b.classList.toggle('on', b.dataset.id === id));
  const ev = EVENTS.find(e => e.id === id);
  document.getElementById('eventTitle').textContent = ev.title + ' (' + ev.date_label + ')';
  document.getElementById('topicList').innerHTML =
    ev.topic.map(t => `<li>${t}</li>`).join('');
  document.getElementById('verdictLine').textContent = ev.verdict;
  document.getElementById('statsLine').textContent = ev.stats;
  document.getElementById('srcList').innerHTML =
    ev.sources.map(s =>
      `<li><a href="${s.url}" target="_blank" rel="noopener">${s.topic}</a> <span class="meta">${s.outlet} ${s.date}</span></li>`).join('');
  const el = document.getElementById('chart');
  try {
    if (typeof Plotly === 'undefined') throw new Error('chart library unavailable');
    const traces = ['market', 'AAA', 'AA', 'A', 'BBB'].map(k => ({
      x: ev.dates, y: ev.series[k], mode: 'lines', name: BAND_NAME[k], line: BAND_STYLE[k]
    }));
    const shapes = ev.hikes.map(h => ({
      type: 'line', x0: h, x1: h, y0: 0, y1: 1, yref: 'paper',
      line: { color: '#dc2626', width: 1.5, dash: 'dash' }
    }));
    const annotations = ev.hikes.map(h => ({
      x: h, y: 1, yref: 'paper', text: '인상', showarrow: false,
      font: { size: 11, color: '#dc2626' }
    }));
    Plotly.newPlot('chart', traces, {
      margin: { t: 20, r: 10, b: 40, l: 50 },
      yaxis: { title: 'bp' }, height: 360,
      shapes: shapes, annotations: annotations
    }, { displayModeBar: false, responsive: true });
  } catch (e) {
    el.innerHTML = '<div style="color:#666;font-size:14px;padding:16px 0;">차트를 불러오지 못했습니다 (차트 라이브러리 연결 실패).</div>';
  }
}
render(EVENTS[0].id);
</script>
